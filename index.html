<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundialito Milenio</title>
    <link rel="icon" type="image/png" href="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/balon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="global-controls">
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_vol.png" id="btn-volumen" title="Sonido">
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logo_2026_vrde.png" class="logo-mundial-global">
</div>

<div class="valla-publicitaria">
    <div class="slider-track">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logomilenioblan.svg" class="logo-valla">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logomilenioblan.svg" class="logo-valla">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logomilenioblan.svg" class="logo-valla">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logomilenioblan.svg" class="logo-valla">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logomilenioblan.svg" class="logo-valla">
    </div>
</div>

<div id="game-ui" style="display: none;">
    <div class="scoreboard-container">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/marcador.png" class="bg-marcador-img">
        <div class="stats-overlay">
            <p><span id="nivel-val">1</span></p>
            <p><span id="goles-val">0</span></p>
            <div class="stat-row"><div id="tiros-icons"></div></div>
            <div class="stat-row"><div id="vidas-icons"></div></div>
        </div>
    </div>
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logo_2026_amarillo.png" class="logo-2026-corner">
</div>

<div class="menu">
    <div class="overlay"></div>
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/logo_laafi.png" class="logo-aficion-main">
    <div class="titulo-container">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/mundialito_milenio_fondo.png" class="fondo-verde-titulo">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/mundialito_milenio.png" class="titulo-texto">
    </div>
    <div class="main-buttons-container">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_jugar.png" class="btn-jugar" id="btn-jugar-start">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_info.png" id="btn-info" class="btn-info-main">
    </div>
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/copa.png" class="copa">
    <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/balon.png" class="balon">

    <div id="modal-instrucciones" class="modal">
        <div class="modal-wrapper">
            <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/instrucciones.png" class="bg-instrucciones">
            <div class="modal-buttons">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_info_ama.png" class="btn-side btn-static">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_creditos.png" class="btn-side" id="btn-open-creditos">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_atras.png" class="btn-side btn-back-main">
            </div>
        </div>
    </div>
    <div id="modal-creditos" class="modal">
        <div class="modal-wrapper-creditos">
            <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/creditos.png" class="bg-panel-creditos">
            <div class="modal-buttons-creditos">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_info.png" class="btn-side" id="btn-regresar-info">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_creditos_ama.png" class="btn-side btn-static">
                <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_atras.png" class="btn-side btn-back-main">
            </div>
        </div>
    </div>
</div>

<div id="question-container" style="display: none;">
    <h2 id="question"></h2>
    <div id="hint-section">
        <img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/boton_pista.png" id="btn-pista">
        <div id="hint-text"></div>
    </div>
    <div class="options-grid">
        <button class="option"></button>
        <button class="option"></button>
        <button class="option"></button>
    </div>
</div>

<img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Juego_vectores/balon.png" id="ball" style="display: none;">
<img src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/portero.svg" id="keeper" style="display: none;">

<div id="explanation" class="modal">
    <div class="explanation-content">
        <div id="explanation-text"></div>
        <button id="continueBtn">CONTINUAR</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
    <audio id="audio-intro" loop>
    <source src="https://cdnpublicidad.milenio.com/2025/PublicidadEditorial/05.Mayo/slider-yt/ProyectoMundial2026/Intro.mp3" type="audio/mpeg">
</audio>
</body>
</html>
